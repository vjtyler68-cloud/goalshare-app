name: spanx
description: "GoalShare - set goals, build habits, and track your progress."
publish_to: 'none'
version: 1.6.1+178

# last updated on 2026-Jun-16
# version: 1.4.0+30

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  dotted_border: ^3.1.0
  http: ^1.2.0
  mobile_scanner: ^7.4.0
  # QR code generation for the "Add people via QR" profile feature. Scanning
  # reuses mobile_scanner (already a dependency); this only draws the code.
  qr_flutter: ^4.1.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  get: ^4.7.2
  google_fonts: ^8.0.0
  image_picker: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.4
  pinput: ^5.0.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  loading_animation_widget: ^1.3.0
  intl: ^0.20.2
  flutter_staggered_grid_view: ^0.7.0
  syncfusion_flutter_charts: ^31.1.17
  url_launcher: ^6.3.2
  fluttertoast: ^8.2.12
  internet_connection_checker: ^3.0.1
  logger: ^2.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.5
  webview_flutter: ^4.14.0
  webview_flutter_wkwebview: ^3.25.1
  # Purpose-built YouTube embed. Hand-rolled WKWebView loads failed (Error 152
  # via loadHtmlString: no real origin; Error 153 via direct embed navigation:
  # no referrer). This package renders the IFrame Player with a proper origin
  # and handles iOS inline playback, fixing both.
  youtube_player_iframe: ^5.2.1
  in_app_purchase: ^3.2.3
  lottie: ^3.3.2
  # Firebase — powers real-time chat (see docs/FIREBASE_SETUP.md)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # Push notifications: friend requests/accepts (sent by the Railway backend)
  # and new chat messages (the sender's app pings the backend, which pushes the
  # recipient). FCM is free on the Firebase Spark plan — no Blaze required. The
  # backend sends via firebase-admin using the APNs .p8 key uploaded to Firebase.
  firebase_messaging: ^15.1.3
  # Local (on-device) reminder notifications — see core/notifications/.
  # No push service / no backend: streak, daily-goal and lead-follow-up nudges
  # are scheduled locally. timezone + flutter_timezone are required so daily
  # reminders fire at the correct LOCAL time via zonedSchedule.
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  health: ^13.3.1
  share_plus: ^12.0.2
  # Listen to the Bible — free, on-device text-to-speech (iOS AVSpeechSynthesizer
  # / Android TTS). No API cost and works fully offline, so any cached chapter
  # can be read aloud with no connection. Configured to play through the speaker
  # even with the silent switch on (playback audio category) and over Bluetooth
  # / CarPlay, so it doesn't look broken when the phone is on mute.
  flutter_tts: ^4.0.0
  # Run/Walk GPS tracking for MY WORKOUT (Strava-style). geolocator streams the
  # device location; flutter_map draws the live route on free OpenStreetMap
  # tiles (no API key / no billing); latlong2 is flutter_map's coordinate type.
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Buddy voice messages: record captures a short AAC clip (uploaded to the
  # asset host), audioplayers plays a buddy's clip from its URL.
  record: ^5.2.1
  audioplayers: ^6.1.0
  # Live magnetic compass in the Mission header. Single monolithic plugin
  # (no federated platform-interface packages), so it can't hit the record-style
  # transitive-dep trap. iOS heading uses CLLocationManager — the app already
  # ships NSLocationWhenInUseUsageDescription for GPS run tracking.
  flutter_compass: ^0.8.1

# record 5.2.1 only requires record_platform_interface ^1.2.0, but pub resolves
# it to the newest allowed (1.6.0). Interface 1.6.0 (May 2026) added an abstract
# `startStream` and changed `hasPermission` — which the still-current platform
# packages record_linux 0.7.2 / record_darwin 1.2.2 (Nov 2024) never implemented,
# so the iOS build's kernel snapshot fails compiling record_linux ("missing
# startStream", "hasPermission fewer named arguments"). Pin the interface to 1.5.0
# (the last release before those breaking changes); every old platform impl
# implements it, and no native pod changes (record_darwin stays 1.2.2).
dependency_overrides:
  record_platform_interface: 1.5.0
  # record_linux 0.7.2 predates interface 1.5.0 too (missing startStream,
  # old hasPermission signature) — the same kernel-snapshot failure the pin
  # above was meant to solve. 1.3.1 is the release built against ^1.5.0.
  # Pure-Dart package, no native pods, so no iOS build-setting changes.
  record_linux: 1.3.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  # CLI-only tooling (run once via `dart run`), moved out of runtime
  # dependencies so they are not bundled into the shipped app.
  rename_app: ^1.6.5
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/jsons/
    - assets/fonts/
